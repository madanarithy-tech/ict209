 const done=latch.filter(Boolean).length;
 const pts=hist.map((v,i)=>`${i*(160/39)},${50-(v-15)*0.5}`).join(' ');
 return <div className="grid h-full grid-cols-1 gap-3 p-3 lg:grid-cols-[250px_1fr_300px] overflow-auto">
  <Card className="flex flex-col p-3 min-h-0">
   <input value={q} onChange={e=>setQ(e.target.value)} placeholder={T('Search chemicals and tools')} className="w-full rounded-lg border border-stone-300 bg-stone-50 px-3 py-2 text-sm outline-none focus:border-teal-400"/>
   <div className="mt-2 flex flex-wrap gap-1">{TABS.map(t=><button key={t} onClick={()=>{setTab(t);setQ('')}} className={'rounded-full px-2.5 py-1 text-xs '+(tab===t&&!q?'bg-teal-700 text-white':'bg-stone-100 hover:bg-stone-200')}>{t}</button>)}</div>
   <div className="mt-3 grid grid-cols-2 gap-2 overflow-auto">{list.map(x=><div key={x.id} draggable onDragStart={e=>e.dataTransfer.setData('text/plain',JSON.stringify({k:x.k,id:x.id}))}
     onClick={()=>tapShelf(x.k,x.id)} className="cursor-grab rounded-xl border border-stone-300 bg-stone-50 p-3 text-center text-xs hover:border-teal-400 active:cursor-grabbing"><div className="text-2xl">{x.e}</div>{x.n}{x.f&&<div className="mt-1 text-[10px] text-teal-700">{FORMLBL[x.f]}</div>}</div>)}
    {!list.length&&<p className="col-span-2 text-sm text-stone-500">Nothing matches that search.</p>}</div>
   <p className="mt-auto pt-3 text-xs text-stone-500">Drag items onto the bench, or tap to add. Tap a chemical to pour into the selected container.</p></Card>

  <div className="flex min-h-[420px] flex-col gap-3">
   <Card className="flex flex-wrap items-center gap-3 p-3 text-sm">
    <span className="font-semibold">Tools</span>
    <div className="flex rounded-lg bg-stone-50 p-1">{[['pour','Pour 25 mL'],['drop','Dropper 2 mL']].map(([k,l])=><button key={k} onClick={()=>setMode(k)} className={'rounded-md px-3 py-1 '+(mode===k?'bg-teal-700 text-white':'')}>{l}</button>)}</div>
    <label className="flex items-center gap-2"><input type="checkbox" checked={stir} onChange={e=>setStir(e.target.checked)}/>Stirrer</label>
    {bun&&<><label className="flex items-center gap-2"><input type="checkbox" checked={bun.on} onChange={e=>setItems(p=>p.map(i=>i.id===bun.id?{...i,on:e.target.checked}:i))}/>Burner</label>
     <label className="flex items-center gap-2">Flame<input type="range" min="1" max="10" value={bun.flame} onChange={e=>setItems(p=>p.map(i=>i.id===bun.id?{...i,flame:+e.target.value}:i))}/></label></>}
    <button onClick={()=>{setItems([]);setSel(null)}} className="ml-auto rounded-lg bg-stone-100 px-3 py-1 hover:bg-rose-600">Clear bench</button></Card>
   <div className="bench relative flex flex-1 flex-wrap items-end justify-center gap-6 overflow-auto rounded-2xl border border-stone-300 p-6 pb-10"
    onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();try{const x=JSON.parse(e.dataTransfer.getData('text/plain'));x.k==='glass'?tapShelf('glass',x.id):setToast('Drop chemicals onto a beaker or flask')}catch(_){}}}>
    {!items.length&&<div className="m-auto text-center text-stone-500"><Molecule className="mx-auto h-20 w-20 opacity-70"/>Drag a beaker from the Glassware tab to start.</div>}
    {items.map(it=>isC(it)?<Glass key={it.id} it={it} d={derive(it)} sel={it.id===sel} stir={stir} pr={pours[it.id]} onSel={setSel} onPour={pour} onDel={id=>setItems(p=>p.filter(i=>i.id!==id))}/>
     :<div key={it.id} className="relative flex w-24 flex-col items-center text-xs text-stone-600">
      {it.kind==='bunsen'&&<>{it.on&&<div className="h-12 w-6 rounded-full bg-gradient-to-t from-blue-500 via-amber-400 to-transparent origin-bottom" style={{transform:`scaleY(${.4+it.flame*.1})`,animation:'flame .3s infinite'}}/>}<div className="h-14 w-10 rounded-t bg-stone-500"/><div className="h-3 w-20 rounded bg-stone-600"/>Bunsen {it.on?'on':'off'}</>}
      {it.kind==='stirrer'&&<><div className="text-4xl">🌀</div>Stirrer<button className="mt-1 rounded bg-stone-100 px-2 py-0.5" onClick={()=>setStir(!stir)}>{stir?'Stop':'Start'}</button></>}
      {it.kind==='therm'&&<><div className="text-4xl">🌡️</div><b className="text-lg text-amber-700">{cur?cur.t.toFixed(1):'--'}°C</b></>}
      <button onClick={()=>setItems(p=>p.filter(i=>i.id!==it.id))} className="absolute -top-2 right-1 h-5 w-5 rounded-full bg-stone-200 hover:bg-rose-600">×</button></div>)}
    {toast&&<div className="absolute left-1/2 top-3 -transtone-x-1/2 rounded-full bg-stone-100 px-4 py-1.5 text-sm shadow">{toast}</div>}</div></div>

  <div className="flex flex-col gap-3 overflow-auto">
   <Card className="p-4"><div className="flex justify-between text-sm"><b>{ex?ex.name:'Free play'}</b>{ex&&<span className="text-emerald-600">{done}/{ex.steps.length}</span>}</div>
    {ex?<><div className="mt-2 h-1.5 rounded bg-stone-100"><div className="h-full rounded bg-emerald-400 transition-all" style={{width:done/ex.steps.length*100+'%'}}/></div>
     <ul className="mt-3 space-y-2 text-sm">{ex.steps.map((s,i)=><li key={i} className={'flex gap-2 '+(latch[i]?'text-emerald-700':'text-stone-600')}><span>{latch[i]?'✔':'○'}</span>{s[0]}</li>)}</ul></>
     :<p className="mt-2 text-sm text-stone-500">Start an experiment from the dashboard for a guided checklist.</p>}</Card>
   <Card className="p-4 text-sm"><b>Live data</b>{cd?<div className="mt-2 space-y-3">
    <div><div className="flex justify-between"><span>Temperature</span><b className="text-amber-700">{cur.t.toFixed(1)} °C</b></div><div className="h-2 rounded bg-stone-100"><div className="h-full rounded bg-amber-400 transition-all" style={{width:cur.t+'%'}}/></div></div>
    <div><div className="flex justify-between"><span>pH</span><b className="text-teal-700">{cd.pH.toFixed(2)}</b></div><div className="relative h-2 rounded" style={{background:'linear-gradient(90deg,#ef4444,#facc15,#22c55e,#3b82f6,#8b5cf6)'}}><span className="absolute -top-1 h-4 w-1 rounded bg-white transition-all" style={{left:cd.pH/14*100+'%'}}/></div></div>
    <div className="flex justify-between"><span>Mass</span><b className="text-emerald-700">{cd.mass.toFixed(1)} g</b></div>
    <svg viewBox="0 0 160 50" className="w-full rounded bg-stone-50"><polyline fill="none" stroke="#b8975a" strokeWidth="1.5" points={pts}/></svg></div>
    :<p className="mt-2 text-stone-500">Add a container to see meters.</p>}</Card>
   <Card className="!border-amber-400/60 p-4 text-sm"><b className="text-amber-600">⚠ Safety alerts</b>
    <div className="mt-2 space-y-2">{alerts.length?alerts.map(a=><div key={a.k} className={'rounded-lg p-2 '+(a.l==='danger'?'bg-rose-500/20 text-rose-800':a.l==='warn'?'bg-amber-500/15 text-amber-800':'bg-teal-500/15 text-teal-800')}>{a.msg}</div>):<div className="text-emerald-600">All clear. Goggles on.</div>}</div></Card></div></div>;
}

function Simple({view,completed,onQuiz}){
 if(view==='inv')return <div className="mx-auto max-w-4xl p-6"><h1 className="mb-4 text-2xl font-bold">Inventory</h1><div className="grid gap-3 sm:grid-cols-2">{Object.values(CHEMS).map((c,i)=><Card key={i} className="p-4"><div className="flex justify-between"><span>{c.e} {c.n}</span><span className="text-stone-500">{c.cat}</span></div><div className="mt-2 h-1.5 rounded bg-stone-100"><div className="h-full rounded bg-teal-400" style={{width:(95-i*9)+'%'}}/></div></Card>)}</div></div>;
 if(view==='safe')return <div className="mx-auto max-w-2xl p-6"><h1 className="mb-4 text-2xl font-bold">Safety manual</h1><Card className="space-y-2 p-5 text-stone-600">{['Wear goggles, gloves and a lab coat at all times.','Add acid to water, never water to acid.','Keep flames away from hydrogen-producing reactions.','Rinse skin splashes with running water for 15 minutes.','Never taste or sniff chemicals directly.'].map(t=><div key={t}>✔ {t}</div>)}<button onClick={onQuiz} className="mt-3 rounded-xl bg-teal-700 px-4 py-2 font-semibold text-white">Take the safety check</button></Card></div>;
 const B=[['First reaction','Complete any experiment',completed>0],['Steady hands','Complete 2 experiments',completed>1],['Lab master','Complete all 3 experiments',completed>2],['Safety first','Pass the safety check',false]];
 return <div className="mx-auto max-w-3xl p-6"><h1 className="mb-4 text-2xl font-bold">Achievements</h1><div className="grid gap-3 sm:grid-cols-2">{B.map(b=><Card key={b[0]} className={'p-4 '+(b[2]?'!border-emerald-500/60':'opacity-60')}><div className="text-2xl">{b[2]?'🏆':'🔒'}</div><b>{b[0]}</b><div className="text-sm text-stone-500">{b[1]}</div></Card>)}</div></div>;
}

function App(){
 const [lang,setLang]=useState('en'),[view,setView]=useState('bench'),[items,setItems]=useState([]),[sel,setSel]=useState(null),[expId,setExpId]=useState(null);
 const [latch,setLatch]=useState([]),[alerts,setAlerts]=useState([]),[mode,setMode]=useState('pour'),[stir,setStir]=useState(false);
 const [hist,setHist]=useState(Array(40).fill(22)),[toast,setToast]=useState(''),[modal,setModal]=useState(null);
 const [passed,setPassed]=useState(false),[completed,setCompleted]=useState(0),[fin,setFin]=useState(false),[pending,setPending]=useState(null);
 const t0=useRef(Date.now()),selR=useRef(),itemsR=useRef();selR.current=sel;itemsR.current=items;
 LANG=lang;
 const ex=EXPS.find(e=>e.id===expId);
 useEffect(()=>{document.body.classList.toggle('km',lang==='km');document.documentElement.lang=lang==='km'?'km':'en';applyLang()},[lang]);
 useEffect(()=>{let r;const mo=new MutationObserver(()=>{cancelAnimationFrame(r);r=requestAnimationFrame(applyLang)});mo.observe(document.getElementById('root'),{subtree:true,childList:true,characterData:true});return()=>mo.disconnect()},[]);
 const warn=(l,msg)=>setAlerts(a=>[{l,msg,k:uid()},...a].slice(0,4));
 useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2200);return()=>clearTimeout(t)},[toast]);
 useEffect(()=>{const t=setInterval(()=>{setItems(p=>{const b=p.find(i=>i.kind==='bunsen'&&i.on);
  return p.map(i=>{if(!isC(i))return i;let t=i.t+(22-i.t)*.04,m=i.m;const hot=b&&i.id===selR.current;
   if(hot)t+=b.flame*.6;t=Math.min(100,t);
   if(hot&&t>=90&&liquid(m)>0)m=Object.fromEntries(Object.entries(m).map(([k,v])=>[k,SOL.includes(k)?v:v*.99]));
   return {...i,t,m}})})},500);
  const h=setInterval(()=>{const c=itemsR.current.find(i=>i.id===selR.current&&isC(i));setHist(x=>[...x.slice(1),c?c.t:22])},1000);
  return()=>{clearInterval(t);clearInterval(h)}},[]);
 const cs=items.filter(isC).map(c=>({...c,d:derive(c)}));
 const prog=ex?ex.steps.map(s=>s[1]({cs,items})):[];
 useEffect(()=>{if(!ex)return;setLatch(l=>{const n=ex.steps.map((_,i)=>!!(l[i]||prog[i]));return n.every((v,i)=>v===!!l[i])?l:n})},[prog.join()]);
 useEffect(()=>{if(ex&&!fin&&latch.length&&latch.every(Boolean)){setFin(true);setCompleted(c=>c+1);setModal('summary')}},[latch]);
 const go=x=>{setExpId(x.id);setLatch([]);setFin(false);setAlerts([]);setItems([]);setSel(null);t0.current=Date.now();setView('bench')};
 const start=x=>{if(x.risk&&!passed){setPending(x);setModal('quiz')}else go(x)};
 const ctx=()=>(ex?'Experiment: '+ex.name+'. ':'Free play. ')+(cs.length?cs.map(c=>`${c.kind} with ${Object.entries(c.m).map(([k,v])=>CHEMS[k].n+' '+Math.round(v)).join(', ')||'nothing'}; ${c.t.toFixed(0)}°C; pH ${c.d.pH.toFixed(1)}`).join(' | '):'bench is empty');
 return <div className="flex h-full">
  <nav className="flex w-16 shrink-0 flex-col gap-1 border-r border-[#e4d8bd] bg-white/70 p-2 backdrop-blur lg:w-60">
   <div className="mb-3 flex items-center gap-2 p-1"><Logo/><span className="serif hidden text-xl leading-tight text-stone-800 lg:inline">Digital Researching Lab</span></div>
   {NAV.map(([k,l,e])=><button key={k} onClick={()=>setView(k)} title={l} className={'flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm '+(view===k?'bg-teal-500/20 text-teal-700':'text-stone-500 hover:bg-stone-100')}><span>{e}</span><span className="hidden lg:inline">{l}</span></button>)}<Sprig className="mt-auto hidden h-24 w-24 self-center opacity-70 lg:block"/>
   <button onClick={()=>setLang(lang==='en'?'km':'en')} aria-label="Switch language" title="English / ខ្មែរ" className="flex items-center gap-2 rounded-xl border border-[#e4d8bd] px-3 py-2.5 text-sm text-stone-700 hover:bg-stone-100 max-lg:mt-auto lg:mt-2"><span>🌐</span><span className="hidden lg:inline">{lang==='en'?'ភាសាខ្មែរ':'English'}</span><span className="text-xs lg:hidden">{lang==='en'?'ខ្មែរ':'EN'}</span></button></nav>
  <main className="min-w-0 flex-1 overflow-auto">
   {view==='dash'&&<Dashboard completed={completed} onStart={start} onResume={()=>setView('bench')} hasLast={ex&&ex.name}/>}
   {view==='bench'&&<Bench {...{items,setItems,sel,setSel,ex,latch,alerts,warn,mode,setMode,hist,stir,setStir,toast,setToast}}/>}
   {['inv','safe','ach'].includes(view)&&<Simple view={view} completed={completed} onQuiz={()=>{setPending(null);setModal('quiz')}}/>}</main>
  <Chat ctx={ctx}/>
  {modal==='quiz'&&<Quiz onClose={()=>setModal(null)} onDone={()=>{setPassed(true);setModal(null);if(pending)go(pending)}}/>}
  {modal==='summary'&&ex&&<Summary ex={ex} secs={Math.round((Date.now()-t0.current)/1000)} onClose={()=>{setModal(null);setView('dash')}}/>}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
